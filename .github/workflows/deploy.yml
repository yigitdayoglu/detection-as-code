name: Deploy Detections

on:
  push:
    branches: [main]
    paths:
      - 'detections/**'
      - 'scripts/deploy_rules.py'
  workflow_dispatch:        # manuel tetikleme (test / yeniden deploy)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy rules to RunReveal
        env:
          RUNREVEAL_TOKEN: ${{ secrets.RUNREVEAL_TOKEN }}
        run: python scripts/deploy_rules.py --apply
